    <style
       id="style1">
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      text {
        font-family: &quot;Inter&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;
      }

      /* 1. Global Typography */
      .title {
        font-size: 28px;
        font-weight: 700;
        fill: #111827; /* Neutral 900 */
      }
      .subtitle {
        font-size: 16px;
        font-weight: 400;
        fill: #4B5563; /* Neutral 600 */
      }
      .zone-header {
        font-size: 18px;
        font-weight: 600;
        fill: #334155; /* Slate 700 */
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .node-header {
        font-size: 14px;
        font-weight: 600;
        fill: #111827; /* Neutral 900 */
      }
      .node-text {
        font-size: 12px;
        fill: #4B5563; /* Neutral 600 */
      }
      .label-small {
        font-size: 11px;
        fill: #6B7280; /* Neutral 500 */
        font-style: italic;
      }
      .label-flow {
        font-size: 11px;
        font-weight: 600;
        fill: #4B5563; /* Neutral 600 */
      }
      .label-flow-return {
        font-size: 11px;
        font-weight: 600;
        fill: #4B5563; /* Neutral 600 */
      }

      /* 2. Zones (Background Areas) */
      /* 2. Zones (Background Areas) */
      .zone-engine {
        fill: #E5F1EC; /* Soft mint */
        stroke: #BFD4C8; /* Mint border */
        stroke-width: 1;
        rx: 16;
      }
      .zone-library {
        fill: #F6E4CE; /* Slightly warmer sand */
        stroke: #CCAC84; /* Slightly warmer border */
        stroke-width: 1;
        rx: 16;
      }
      
      /* 3. Interface Layer (The Bridge) */
      .zone-interface {
        fill: #F7FAFD; /* Light cool panel */
        stroke: #C9D7E4; /* Cool border */
        stroke-width: 1;
        stroke-dasharray: 6 4;
        rx: 12;
      }

      /* 4. Nodes (Action/Component Boxes) */
      /* Master Node: Blue Theme */
      .node-master {
        fill: #EAF3FC; /* Cool light */
        stroke: #8FAEC4; /* Cool medium */
        stroke-width: 1.5;
        rx: 8;
      }
      /* Abstract Node (Shared for Env and Oracle): Purple/Gray/Neutral Theme */
      .node-abstract {
        fill: #EEF4FA; /* Cool neutral */
        stroke: #9CB5C8; /* Cool muted */
        stroke-width: 1.5;
        stroke-dasharray: 4 2; /* Dashed to imply abstract/interface */
        rx: 8;
      }
      /* Abstract Oracle (Amber Theme) to match Banana Arsenal */
      .node-abstract-oracle {
        fill: #F7EBDD; /* Warm light */
        stroke: #C79C74; /* Warm medium */
        stroke-width: 1.5;
        stroke-dasharray: 4 2;
        rx: 8;
      }
      /* Abstract Env/Driver (Green Theme) to match Engine */
      .node-abstract-env {
        fill: #EAF4EE; /* Mint light */
        stroke: #9FBDAF; /* Mint medium */
        stroke-width: 1.5;
        stroke-dasharray: 4 2;
        rx: 8;
      }
      /* Concrete Oracle Implementation: Amber Theme */
      .node-concrete {
        fill: #F7EBDD; /* Warm light */
        stroke: #C79C74; /* Warm medium */
        stroke-width: 1.5;
        rx: 8;
      }
      /* Problem-Specific Oracle: Orange Theme */
      .node-problem {
        fill: #F3E1CC; /* Warm accent */
        stroke: #B9855F; /* Warm dark */
        stroke-width: 1.5;
        rx: 8;
      }
       /* Concrete Oracle Strategy: Yellow Theme */
      .node-strategy {
        fill: #F9EFE2; /* Warm pale */
        stroke: #C79C74; /* Warm medium */
        stroke-width: 1.2;
        rx: 6;
      }
      
      /* Driver/Environment Nodes: Green Theme */
      .node-driver {
        fill: #EAF4EE; /* Mint light */
        stroke: #9FBDAF; /* Mint medium */
        stroke-width: 1.5;
        rx: 8;
      }

      /* 5. Connectors */
      .arrow-flow {
        stroke: #334155; /* Slate 700 */
        stroke-width: 2.0;
        fill: none;
        stroke-linejoin: round;
        stroke-linecap: round;
        marker-end: url(#arrow-head);
      }
      .arrow-flow-return {
        stroke: #334155; /* Slate 700 - Reverted to Slate */
        stroke-width: 2.0;
        fill: none;
        stroke-linejoin: round;
        stroke-linecap: round;
        marker-end: url(#arrow-head);
      }
      .arrow-impl {
        stroke: #8A98A6; /* Neutral connector */
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 5 3;
        stroke-linejoin: round;
        stroke-linecap: round;
        marker-end: url(#arrow-head-muted);
      }
      
      /* Inner Nodes */
      .node-inner-blue { fill: #CFE0EF; stroke: #8FAEC4; rx: 4; }
      .node-inner-amber { fill: #E9C9A6; stroke: #C79C74; rx: 4; }
      .node-inner-orange { fill: #E2B894; stroke: #B9855F; rx: 4; }
      .node-inner-emerald { fill: #CFE1D8; stroke: #8FB2A3; rx: 4; }

      /* 6. Utility */
      .highlight-loop {
        fill: none;
        stroke: #8FAEC4; /* Cool muted */
        stroke-width: 3;
        stroke-opacity: 0.1;
      }
    </style>
