<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1400"
   height="800"
   viewBox="0 0 1400 800"
   version="1.1"
   id="svg50"
   sodipodi:docname="bendersx-architecture-v5.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1">
    <style
       id="style1">
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      text {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      /* 1. Global Typography */
      .title {
        font-size: 28px;
        font-weight: 700;
        fill: #1E293B; /* Slate 800 */
      }
      .subtitle {
        font-size: 16px;
        font-weight: 400;
        fill: #64748B; /* Slate 500 */
      }
      .zone-header {
        font-size: 18px;
        font-weight: 600;
        fill: #334155; /* Slate 700 */
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .node-header {
        font-size: 14px;
        font-weight: 600;
        fill: #1E293B; /* Slate 800 */
      }
      .node-text {
        font-size: 12px;
        fill: #475569; /* Slate 600 */
      }
      .label-small {
        font-size: 11px;
        fill: #64748B; /* Slate 500 */
        font-style: italic;
      }
      .label-flow {
        font-size: 11px;
        font-weight: 600;
        fill: #475569; /* Slate 600 - Reverted */
      }
      .label-flow-return {
        font-size: 11px;
        font-weight: 600;
        fill: #475569; /* Slate 600 - Reverted */
      }

      /* 2. Zones (Background Areas) */
      .zone-engine {
        fill: #E6F3FF; /* Pale Blue - Runtime/Engine */
        stroke: #BFDBFE; /* Blue 200 */
        stroke-width: 1;
        rx: 16;
      }
      .zone-library {
        fill: #F0FDF4; /* Pale Green/Mint - Library/Extensions */
        stroke: #BBF7D0; /* Green 200 */
        stroke-width: 1;
        rx: 16;
      }
      
      /* 3. Interface Layer (The Bridge) */
      .zone-interface {
        fill: #F8FAFC; /* Slate 50 */
        stroke: #CBD5E1; /* Slate 300 */
        stroke-width: 1;
        stroke-dasharray: 6 4;
        rx: 12;
      }

      /* 4. Nodes (Action/Component Boxes) */
      /* Master Node: Blue Theme */
      .node-master {
        fill: #EFF6FF; /* Blue 50 */
        stroke: #3B82F6; /* Blue 500 */
        stroke-width: 1.5;
        rx: 8;
      }
      /* Abstract Node (Shared for Env and Oracle): Purple/Gray/Neutral Theme */
      .node-abstract {
        fill: #F5F3FF; /* Violet 50 */
        stroke: #8B5CF6; /* Violet 500 */
        stroke-width: 1.5;
        stroke-dasharray: 4 2; /* Dashed to imply abstract/interface */
        rx: 8;
      }
      /* Concrete Oracle Implementation: Green Theme */
      .node-concrete {
        fill: #FFFBEB; /* Amber 50 (Warm) or Mint */
        stroke: #F59E0B; /* Amber 500 */
        stroke-width: 1.5;
        rx: 8;
      }
       /* Concrete Oracle Strategy: Teal Theme */
      .node-strategy {
        fill: #ECFDF5; /* Emerald 50 */
        stroke: #10B981; /* Emerald 500 */
        stroke-width: 1.2;
        rx: 6;
      }
      
      /* Driver/Environment Nodes: Red/Pink Theme */
      .node-driver {
        fill: #FFF1F2; /* Rose 50 */
        stroke: #E11D48; /* Rose 600 */
        stroke-width: 1.5;
        rx: 8;
      }

      /* 5. Connectors */
      .arrow-flow {
        stroke: #334155; /* Slate 700 */
        stroke-width: 2.0;
        fill: none;
        stroke-linejoin: round;
        stroke-linecap: round;
        marker-end: url(#arrow-head);
      }
      .arrow-flow-return {
        stroke: #334155; /* Slate 700 - Reverted to Slate */
        stroke-width: 2.0;
        fill: none;
        stroke-linejoin: round;
        stroke-linecap: round;
        marker-end: url(#arrow-head);
      }
      .arrow-impl {
        stroke: #94A3B8; /* Slate 400 */
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 5 3;
        stroke-linejoin: round;
        stroke-linecap: round;
        marker-end: url(#arrow-head-muted);
      }

      /* 6. Utility */
      .highlight-loop {
        fill: none;
        stroke: #3B82F6; /* Blue 500 */
        stroke-width: 3;
        stroke-opacity: 0.1;
      }
    </style>

    <!-- Markers -->
    <marker id="arrow-head" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 L1.5,3 Z" fill="#334155" />
    </marker>
    <marker id="arrow-head-muted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 L1.5,3 Z" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="1400" height="800" fill="#FFFFFF" />

  <!-- A. Header -->
  <text x="700" y="60" text-anchor="middle" class="title">BendersX.jl Architecture</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">Fully Polymorphic Design: Swappable Environments &amp; Plug-and-Play Components</text>

  <!-- B. Zones -->
  <!-- Zone 1: The Engine (BendersBase.jl) -->
  <rect x="50" y="140" width="550" height="580" class="zone-engine" />
  <text x="325" y="180" text-anchor="middle" class="zone-header">THE ENGINE (BendersBase.jl)</text>
  <text x="325" y="200" text-anchor="middle" class="label-small">Core Interfaces &#8226; Execution Drivers</text>

  <!-- Zone 2: The Arsenal (BendersLibrary.jl) -->
  <rect x="650" y="140" width="700" height="580" class="zone-library" />
  <text x="1000" y="180" text-anchor="middle" class="zone-header">THE ARSENAL (BendersLibrary.jl)</text>
  <text x="1000" y="200" text-anchor="middle" class="label-small">Concrete Oracles &#8226; Problem-Specific Logic</text>

  <!-- C. The Engine Interfaces (Abstract Layer) -->
  
  <!-- C1. Driver Interface (AbstractBendersEnv) -->
  <rect x="100" y="240" width="450" height="180" class="node-abstract" />
  <text x="325" y="270" text-anchor="middle" class="node-header">AbstractBendersEnv</text>
  <text x="325" y="290" text-anchor="middle" class="label-small">[Driver Interface]</text>
  
  <!-- Inside Env: Master and Oracle Slots -->
  <line x1="120" y1="300" x2="530" y2="300" stroke="#CBD5E1" stroke-width="1" />
  
  <!-- Master Slot -->
  <rect x="130" y="320" width="140" height="80" class="node-master" />
  <text x="200" y="350" text-anchor="middle" class="node-header">Master</text>
  <text x="200" y="370" text-anchor="middle" class="label-small">(JuMP Model)</text>

  <!-- Oracle Slot (Abstract) -->
  <rect x="380" y="320" width="140" height="80" class="node-abstract" stroke-dasharray="2 2" />
  <text x="450" y="350" text-anchor="middle" class="node-header">AbstractOracle</text>
  <text x="450" y="370" text-anchor="middle" class="label-small">(Socket)</text>

  <!-- Flow within Env (Updated to Match v3 Loop Geometry) -->
  <!-- Master -> Oracle (Candidate) - Route around bottom -->
  <path d="M 200,400 L 200,450 L 450,450 L 450,400" class="arrow-flow" />
  <text x="325" y="440" text-anchor="middle" class="label-small">x, t (Candidate)</text>
  
  <!-- Oracle -> Master (Cuts) - Route direct through middle -->
  <path d="M 380,360 L 270,360" class="arrow-flow" />
  <text x="325" y="350" text-anchor="middle" class="label-small">Cuts / Bounds</text>


  <!-- D. Concrete Drivers (Polymorphic Strategies) -->
  <text x="325" y="490" text-anchor="middle" class="label-small" fill="#94A3B8">Select Execution Strategy:</text>
  
  <!-- Driver 1: BendersSeq -->
  <rect x="100" y="510" width="200" height="100" class="node-driver" />
  <text x="200" y="540" text-anchor="middle" class="node-header">BendersSeq</text>
  <text x="200" y="560" text-anchor="middle" class="node-text">solve!(env)</text>
  <text x="200" y="580" text-anchor="middle" class="label-small">Iterative Loop</text>
  <!-- Loop Icon -->
  <path d="M 230,535 A 10,10 0 1 1 230,555" fill="none" stroke="#E11D48" stroke-width="2" opacity="0.3" transform="translate(-60, 0)" />

  <!-- Driver 2: BendersBnB -->
  <rect x="350" y="510" width="200" height="100" class="node-driver" />
  <text x="450" y="540" text-anchor="middle" class="node-header">BendersBnB</text>
  <text x="450" y="560" text-anchor="middle" class="node-text">solve!(env)</text>
  <text x="450" y="580" text-anchor="middle" class="label-small">Branch &amp; Bound</text>
  <!-- Tree Icon Hint -->
  <path d="M 450,520 L 440,530 M 450,520 L 460,530" stroke="#E11D48" stroke-width="2" opacity="0.3" />


  <!-- Connection: Drivers implement AbstractEnv -->
  <path d="M 200,510 L 200,420" class="arrow-impl" />
  <path d="M 450,510 L 450,420" class="arrow-impl" />


  <!-- E. The Arsenal (Implementations) -->
  
  <!-- E1. Standard Block -->
  <rect x="700" y="250" width="280" height="360" class="zone-interface" fill="#FFFFFF" />
  <text x="840" y="280" text-anchor="middle" class="node-header">Standard Oracles</text>

    <!-- ClassicalOracle -->
    <rect x="730" y="300" width="220" height="60" class="node-concrete" />
    <text x="840" y="325" text-anchor="middle" class="node-header">ClassicalOracle</text>
    <text x="840" y="345" text-anchor="middle" class="label-small">Single-cut Benders</text>

    <!-- ParetoOracle -->
    <rect x="730" y="380" width="220" height="60" class="node-concrete" />
    <text x="840" y="405" text-anchor="middle" class="node-header">ParetoOracle</text>
    <text x="840" y="425" text-anchor="middle" class="label-small">Magnanti-Wong</text>

    <!-- SeparableOracle -->
    <rect x="730" y="460" width="220" height="60" class="node-concrete" />
    <text x="840" y="485" text-anchor="middle" class="node-header">SeparableOracle</text>
    <text x="840" y="505" text-anchor="middle" class="label-small">Multi-cut / Parallel</text>

  <!-- E2. Advanced/Disjunctive Block -->
  <rect x="1020" y="250" width="280" height="360" class="zone-interface" fill="#FFFFFF" />
  <text x="1160" y="280" text-anchor="middle" class="node-header">Advanced / Disjunctive</text>

    <!-- SplitOracle -->
    <rect x="1050" y="300" width="220" height="140" class="node-concrete" stroke="#8B5CF6" fill="#F5F3FF" />
    <text x="1160" y="325" text-anchor="middle" class="node-header">SplitOracle</text>
    <text x="1160" y="345" text-anchor="middle" class="label-small">Split Cuts / CGLP</text>
    
    <!-- Inner Strategies for Split -->
    <rect x="1070" y="360" width="180" height="30" class="node-strategy" />
    <text x="1160" y="380" text-anchor="middle" class="node-text">SelectionRule</text>
    
    <rect x="1070" y="400" width="180" height="30" class="node-strategy" />
    <text x="1160" y="420" text-anchor="middle" class="node-text">DisjCutsAppendRule</text>


  <!-- F. Implementation Arrows (The "Plug-in") -->
  <!-- Connecting Concrete to Abstract -->
  <!-- Note: We connect to the "Socket" inside the AbstractEnv -->
  <path d="M 700,330 L 520,340" class="arrow-impl" />
  <path d="M 700,410 L 600,410 L 600,360 L 520,360" class="arrow-impl" />
  
  <path d="M 1020,370 L 980,370 L 980,620 L 560,620 L 560,380 L 520,380" class="arrow-impl" stroke-dasharray="2 2" />


  <!-- G. Legend/Footer -->
  <rect x="50" y="740" width="1300" height="40" fill="#F8FAFC" rx="4" />
  <text x="700" y="765" text-anchor="middle" class="label-small">
    Master Problem &#8592; [Abstract Interface] &#8592; Concrete Implementation (User Selected)
  </text>

</svg>
