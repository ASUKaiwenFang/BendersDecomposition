<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1400"
   height="800"
   viewBox="0 0 1400 800"
   version="1.1"
   id="svg50"
   sodipodi:docname="bendersx-architecture-v6.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview47"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.225"
     inkscape:cx="699.77528"
     inkscape:cy="400"
     inkscape:window-width="3840"
     inkscape:window-height="2036"
     inkscape:window-x="-12"
     inkscape:window-y="-12"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg50" />
  <defs id="defs1">
    <style id="style1">
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');

      text {
        font-family: &quot;Inter&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;
      }

      /* Apple Typography */
      .title { font-size: 30px; font-weight: 600; fill: #1D1D1F; letter-spacing: -0.5px; }
      .subtitle { font-size: 15px; font-weight: 400; fill: #86868B; letter-spacing: 0.2px; }
      .zone-header { font-size: 13px; font-weight: 600; fill: #86868B; text-transform: uppercase; letter-spacing: 2px; }
      .node-header { font-size: 14px; font-weight: 500; fill: #1D1D1F; }
      .node-text { font-size: 12px; font-weight: 400; fill: #6E6E73; }
      .label-small { font-size: 11px; fill: #86868B; font-style: normal; font-weight: 400; }
      .label-flow { font-size: 11px; font-weight: 500; fill: #6E6E73; }

      /* Zones — Apple tinted */
      .zone-engine { fill: #EFF8F3; stroke: none; rx: 20; }  /* Soft mint-green tint */
      .zone-library { fill: #FBF6F1; stroke: none; rx: 20; } /* Soft warm-sand tint */
      .zone-interface { fill: #FFFFFF; stroke: #EBE5DF; stroke-width: 1; rx: 14; } /* Warm border */

      /* Nodes */
      .node-master { fill: #FFFFFF; stroke: #D4E4F0; stroke-width: 1; rx: 12; }  /* Blue-tinted border */
      .node-abstract { fill: #FFFFFF; stroke: #E5E5E5; stroke-width: 1; stroke-dasharray: 4 2; rx: 12; }
      .node-abstract-oracle { fill: #FFF9F5; stroke: #E8D8CA; stroke-width: 1; stroke-dasharray: 4 2; rx: 12; } /* Warm oracle */
      .node-abstract-env { fill: #F8FDF9; stroke: #D0E3D7; stroke-width: 1; stroke-dasharray: 4 2; rx: 12; }  /* Green env */
      .node-concrete { fill: #FFFCF9; stroke: #E8DDD3; stroke-width: 1; rx: 10; }  /* Warm concrete */
      .node-driver { fill: #F8FDF9; stroke: #D0E3D7; stroke-width: 1; rx: 12; }   /* Green driver */

      /* Connectors */
      .arrow-flow { stroke: #1D1D1F; stroke-width: 1.5; fill: none; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow-head); }
      .arrow-impl { stroke: #86868B; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow-head-muted); }

      /* Inner Nodes — subtle warm pills */
      .node-inner-blue { fill: #EDE7E0; stroke: none; rx: 6; }
      .node-inner-amber { fill: #F0E4D8; stroke: none; rx: 6; }
      .node-inner-orange { fill: #EDE7E0; stroke: none; rx: 6; }
      .node-inner-emerald { fill: #F0E4D8; stroke: none; rx: 6; }
    </style>

    <!-- Arrowhead markers -->
    <marker id="arrow-head" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 L1.5,3 Z" fill="#1D1D1F" id="path1" />
    </marker>
    <marker id="arrow-head-muted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 L1.5,3 Z" fill="#86868B" id="path2" />
    </marker>

    <!-- Apple-style Shadow Filters -->
    <filter id="zone-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.06" result="color" />
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.08" result="color" />
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="card-shadow-subtle" x="-4%" y="-4%" width="108%" height="112%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.05" result="color" />
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background gradient -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBFBFD" />
      <stop offset="100%" stop-color="#F2F2F7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1400" height="800" fill="url(#bg-gradient)" id="rect2" />

  <!-- A. Header -->
  <text x="700" y="58" text-anchor="middle" class="title" id="text2">BendersX.jl Architecture</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle" id="text3">Fully Polymorphic Design: Swappable Environments &amp; Plug-and-Play Components</text>

  <!-- B. Zones -->

  <!-- Zone 1A: Core Interface -->
  <rect x="50" y="130" width="550" height="350" fill="#F0F7FF" stroke="#DCEAF7" stroke-width="1" rx="20" filter="url(#zone-shadow)" id="rect-core-interface" />
  <!-- Accent pill -->
  <rect x="270" y="155" width="110" height="22" rx="11" fill="#0071E3" fill-opacity="0.1" />
  <text x="325" y="170" text-anchor="middle" class="zone-header" fill="#0071E3" id="text-core-header" style="font-size:11px; letter-spacing:1.5px">CORE INTERFACE</text>
  <text x="325" y="192" text-anchor="middle" class="label-small" fill="#86868B" id="text-core-desc">Abstract Definitions · Interaction Logic</text>

  <!-- Zone 1B: The Engine -->
  <rect x="50" y="500" width="550" height="220" class="zone-engine" filter="url(#zone-shadow)" id="rect-engine" />
  <text x="325" y="528" text-anchor="middle" class="zone-header" id="text-engine-header">THE ENGINE</text>
  <text x="325" y="548" text-anchor="middle" class="label-small" id="text-engine-desc">Polymorphic Strategies · Loop Control</text>

  <!-- Zone 2: The Arsenal -->
  <rect x="650" y="130" width="700" height="590" class="zone-library" filter="url(#zone-shadow)" id="rect5" />
  <text x="1000" y="168" text-anchor="middle" class="zone-header" id="text6">THE ARSENAL</text>
  <text x="1000" y="190" text-anchor="middle" class="label-small" id="text7">Concrete Oracles · Problem-Specific Logic</text>

  <!-- C. AbstractBendersEnv -->
  <rect x="100" y="230" width="450" height="240" class="node-abstract-env" filter="url(#card-shadow)" id="rect7" />
  <text x="325" y="260" text-anchor="middle" class="node-header" fill="#1D1D1F" id="text8">AbstractBendersEnv</text>
  <text x="325" y="278" text-anchor="middle" class="label-small" fill="#86868B" id="text9">[Driver Interface]</text>

  <!-- Divider -->
  <line x1="120" y1="290" x2="530" y2="290" stroke="#D0E3D7" stroke-width="1" id="line9" />

  <!-- Master Slot -->
  <rect x="130" y="310" width="140" height="80" class="node-master" filter="url(#card-shadow)" id="rect9" />
  <text x="200" y="342" text-anchor="middle" class="node-header" id="text10">Master</text>
  <text x="200" y="362" text-anchor="middle" class="label-small" id="text11">(JuMP Model)</text>

  <!-- Oracle Slot -->
  <rect x="380" y="310" width="140" height="80" class="node-abstract-oracle" stroke-dasharray="4 2" id="rect11" />
  <text x="450" y="342" text-anchor="middle" class="node-header" fill="#1D1D1F" id="text12">AbstractOracle</text>
  <text x="450" y="362" text-anchor="middle" class="label-small" fill="#86868B" id="text13">(Socket)</text>

  <!-- Flow: Master → Oracle -->
  <path d="M 200,390 L 200,445 L 450,445 L 450,390" class="arrow-flow" id="path13" />
  <text x="325" y="435" text-anchor="middle" class="label-small" id="text14">x, t (Candidate)</text>

  <!-- Flow: Oracle → Master -->
  <path d="M 380,350 L 270,350" class="arrow-flow" id="path14" />
  <text x="325" y="340" text-anchor="middle" class="label-small" id="text15">Cuts / Bounds</text>

  <!-- D. Drivers -->
  <rect x="70" y="565" width="160" height="100" class="node-driver" filter="url(#card-shadow)" id="rect16" />
  <text x="150" y="595" text-anchor="middle" class="node-header" id="text17">BendersSeq</text>
  <text x="150" y="615" text-anchor="middle" class="node-text" id="text18">Standard Loop</text>
  <text x="150" y="635" text-anchor="middle" class="label-small" id="text19">Iterative</text>

  <rect x="245" y="565" width="160" height="100" class="node-driver" filter="url(#card-shadow)" id="rect19" />
  <text x="325" y="595" text-anchor="middle" class="node-header" id="text20">BendersSeqInOut</text>
  <text x="325" y="615" text-anchor="middle" class="node-text" id="text21">Stabilized Loop</text>
  <text x="325" y="635" text-anchor="middle" class="label-small" id="text22">In-Out Method</text>

  <rect x="420" y="565" width="160" height="100" class="node-driver" filter="url(#card-shadow)" id="rect22" />
  <text x="500" y="595" text-anchor="middle" class="node-header" id="text23">BendersBnB</text>
  <text x="500" y="615" text-anchor="middle" class="node-text" id="text24">Callback Mode</text>
  <text x="500" y="635" text-anchor="middle" class="label-small" id="text25">Branch &amp; Bound</text>

  <!-- E. Arsenal 2×2 Grid -->

  <!-- Top Left: General TypicalOracle -->
  <rect x="670" y="230" width="310" height="240" class="zone-interface" filter="url(#card-shadow)" id="rect27" />
  <text x="825" y="260" text-anchor="middle" class="node-header" id="text27">General TypicalOracle</text>

  <rect x="715" y="280" width="220" height="50" class="node-concrete" filter="url(#card-shadow-subtle)" id="rect28" />
  <text x="825" y="305" text-anchor="middle" class="node-header" id="text28">ClassicalOracle</text>
  <text x="825" y="320" text-anchor="middle" class="label-small" style="font-size:10px" id="text29">Single-cut classcal benders cut</text>

  <rect x="715" y="340" width="220" height="50" class="node-concrete" filter="url(#card-shadow-subtle)" id="rect29" />
  <text x="825" y="365" text-anchor="middle" class="node-header" id="text30">UnifiedOracle</text>
  <text x="825" y="380" text-anchor="middle" class="label-small" style="font-size:10px" id="text31">Optimality-feasiblility-unified benders cut</text>

  <rect x="715" y="400" width="220" height="50" class="node-concrete" filter="url(#card-shadow-subtle)" id="rect31" />
  <text x="825" y="425" text-anchor="middle" class="node-header" id="text32">ParetoOracle</text>
  <text x="825" y="440" text-anchor="middle" class="label-small" style="font-size:10px" id="text33">Magnanti-Wong benders cut</text>

  <!-- Top Right: Problem-Specific Oracle -->
  <rect x="1000" y="230" width="310" height="240" class="zone-interface" filter="url(#card-shadow)" id="rect33" />
  <text x="1155" y="260" text-anchor="middle" class="node-header" id="text34">Problem-Specific Oracle</text>

  <rect x="1025" y="290" width="260" height="70" class="node-concrete" filter="url(#card-shadow-subtle)" id="rect34" />
  <text x="1155" y="315" text-anchor="middle" class="node-header" id="text35">CFLP Knapsack</text>
  <text x="1155" y="335" text-anchor="middle" class="label-small" style="font-size:10px" id="text36">Knapsack technique-based cut</text>
  <text x="1155" y="350" text-anchor="middle" class="label-small" style="font-size:10px" id="text36b">for Capacitated Facility Location</text>

  <rect x="1025" y="380" width="260" height="70" class="node-concrete" filter="url(#card-shadow-subtle)" id="rect36" />
  <text x="1155" y="405" text-anchor="middle" class="node-header" id="text37">UFLP Knapsack</text>
  <text x="1155" y="425" text-anchor="middle" class="label-small" style="font-size:10px" id="text38">Knapsack technique-based cut</text>
  <text x="1155" y="440" text-anchor="middle" class="label-small" style="font-size:10px" id="text38b">for Uncapacitated Facility Location</text>

  <!-- Bottom Left: DisjunctiveOracle -->
  <rect x="670" y="480" width="310" height="200" class="zone-interface" filter="url(#card-shadow)" id="rect38" />
  <text x="825" y="510" text-anchor="middle" class="node-header" id="text39">DisjunctiveOracle</text>

  <rect x="715" y="530" width="220" height="120" class="node-concrete" filter="url(#card-shadow-subtle)" id="rect39" />
  <text x="825" y="555" text-anchor="middle" class="node-header" id="text40">SplitOracle</text>

  <rect x="735" y="570" width="80" height="40" class="node-inner-orange" rx="8" />
  <text x="775" y="595" text-anchor="middle" class="label-small" style="font-weight:500; fill:#1D1D1F">Oracle 1</text>

  <rect x="835" y="570" width="80" height="40" class="node-inner-emerald" rx="8" />
  <text x="875" y="595" text-anchor="middle" class="label-small" style="font-weight:500; fill:#1D1D1F">Oracle 2</text>

  <text x="825" y="638" text-anchor="middle" class="label-small" id="text41">Split benders cuts</text>

  <!-- Bottom Right: SeparableOracle -->
  <rect x="1000" y="480" width="310" height="200" class="zone-interface" filter="url(#card-shadow)" id="rect41" />
  <text x="1155" y="510" text-anchor="middle" class="node-header" id="text42">SeparableOracle</text>

  <rect x="1045" y="540" width="220" height="100" class="node-concrete" filter="url(#card-shadow-subtle)" id="rect42" />
  <text x="1155" y="565" text-anchor="middle" class="node-header" id="text43">SeparableOracle</text>

  <rect x="1060" y="580" width="60" height="30" class="node-inner-blue" rx="8" />
  <text x="1090" y="600" text-anchor="middle" class="label-small" style="font-size:9px; fill:#1D1D1F">Oracle</text>

  <rect x="1125" y="580" width="60" height="30" class="node-inner-amber" rx="8" />
  <text x="1155" y="600" text-anchor="middle" class="label-small" style="font-size:9px; fill:#1D1D1F">Oracle</text>

  <rect x="1190" y="580" width="60" height="30" class="node-inner-emerald" rx="8" />
  <text x="1220" y="600" text-anchor="middle" class="label-small" style="font-size:9px; fill:#1D1D1F">Oracle</text>

  <text x="1155" y="630" text-anchor="middle" class="label-small" id="text44">Parallel / Multi-cut</text>

  <!-- F. Connectors -->
  <path d="M 650,360 L 520,360" class="arrow-impl" stroke-width="2" stroke-dasharray="8 4" id="path-main-connector" />

  <path d="M 325,500 L 325,470" class="arrow-impl" stroke-width="2" stroke-dasharray="8 4" marker-end="none" id="path-driver-connector" />
  <path d="M 325,470 L 320,480 L 330,480 Z" fill="#86868B" />

  <!-- G. Legend -->
  <rect x="50" y="740" width="1300" height="40" fill="#F5F5F7" rx="12" id="rect47" />
  <text x="700" y="764" text-anchor="middle" class="label-small" fill="#86868B" id="text47">Master Problem ← [Abstract Interface] ← Concrete Implementation (User Selected)</text>

</svg>
