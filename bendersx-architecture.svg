<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .title {
        font-family: "Helvetica", Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #0F172A;
      }

      .subtitle {
        font-family: "Helvetica", Arial, sans-serif;
        font-size: 11px;
        fill: #475569;
      }

      .cluster-title {
        font-family: "Helvetica", Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #0F172A;
      }

      .box-title {
        font-family: "Helvetica", Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #0F172A;
      }

      .box-text {
        font-family: "Helvetica", Arial, sans-serif;
        font-size: 9.5px;
        fill: #1F2937;
      }

      .label {
        font-family: "Helvetica", Arial, sans-serif;
        font-size: 8.5px;
        fill: #334155;
      }

      .outer {
        fill: none;
        stroke: #334155;
        stroke-width: 1.1;
      }

      .loop {
        fill: #FFF8E8;
        stroke: #B7791F;
        stroke-width: 1.0;
        stroke-dasharray: 4 3;
      }

      .base {
        fill: #EAF2FF;
        stroke: #2B6CB0;
        stroke-width: 1.0;
      }

      .ext {
        fill: #E9F7EF;
        stroke: #2F855A;
        stroke-width: 1.0;
      }

      .box {
        fill: #FFFFFF;
        stroke: #334155;
        stroke-width: 1.0;
      }

      .band {
        fill: #FFF8E8;
        stroke: #B7791F;
        stroke-width: 1.0;
      }

      .arrow {
        stroke: #1F2937;
        stroke-width: 1.3;
        fill: none;
        marker-end: url(#arrow);
      }

      .arrow-dashed {
        stroke: #475569;
        stroke-width: 1.2;
        fill: none;
        stroke-dasharray: 4 3;
        marker-end: url(#arrow);
      }

      .zoom-line {
        stroke: #94A3B8;
        stroke-width: 1.1;
        fill: none;
        stroke-dasharray: 4 3;
      }

      .zoom-focus {
        fill: none;
        stroke: #94A3B8;
        stroke-width: 1.1;
        stroke-dasharray: 4 3;
      }

      .iface-line {
        fill: none;
        stroke: #5BB8F2;
        stroke-width: 1.0;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="#FFFFFF" />

  <text x="700" y="44" text-anchor="middle" class="title">BendersX Architecture</text>
  <text x="700" y="68" text-anchor="middle" class="subtitle">BendersBase provides the core workflow; BendersLibrary
    plugs in extensions</text>

  <!-- Outer environment -->
  <rect x="60" y="86" width="1280" height="760" rx="24" class="outer" />
  <text x="90" y="120" class="cluster-title">Environment</text>

  <!-- Core loop (runtime view) -->
  <rect x="370" y="166" width="580" height="294" rx="36" class="loop" />

  <rect x="630" y="191" width="180" height="62" rx="10" class="box" />
  <text x="720" y="216" text-anchor="middle" class="box-title">Master</text>
  <text x="720" y="238" text-anchor="middle" class="box-text">core model</text>

  <rect x="439" y="282" width="132" height="64" rx="10" class="box" />
  <text x="505" y="302" text-anchor="middle" class="box-title">Loop Strategy</text>
  <text x="505" y="324" text-anchor="middle" class="box-text">control and schedule</text>
  <rect x="431" y="274" width="148" height="80" rx="12" class="zoom-focus" />

  <rect x="630" y="373" width="180" height="62" rx="10" class="box" style="stroke-width:1.3" />
  <text x="720" y="398" text-anchor="middle" class="box-title">Oracle</text>
  <text x="720" y="420" text-anchor="middle" class="box-text">separation and cuts</text>
  <rect x="622" y="365" width="196" height="78" rx="12" class="zoom-focus" />

  <circle cx="813" cy="385" r="7" fill="none" stroke="#334155" stroke-width="1.1" />
  <path d="M818,390 L824,396" stroke="#334155" stroke-width="1.1" fill="none" />

  <rect x="1040" y="261" width="120" height="82" rx="10" class="box" />
  <text x="1100" y="278" text-anchor="middle" class="box-title">Log</text>
  <text x="1100" y="301" text-anchor="middle" class="box-text">observer</text>
  <ellipse cx="1100" cy="322" rx="13" ry="7" fill="none" stroke="#334155" stroke-width="1.1" />
  <circle cx="1100" cy="322" r="2.5" fill="#475569" />

  <!-- Core arrows -->
  <path d="M706,253 L706,373" class="arrow" />
  <text x="625" y="318" class="label">candidate solution</text>

  <path d="M734,373 L734,253" class="arrow" />
  <text x="744" y="318" class="label">cut</text>

  <path d="M571,314 C615,306 660,306 706,314" class="arrow-dashed" />

  <!-- Environment variants (outside loop, left side) -->
  <path d="M97,214 L233,214 L233,300 L177,300 L171,316 L159,316 L153,300 L97,300 Z" class="base" />
  <text x="165" y="238" text-anchor="middle" class="box-title">BendersBase</text>
  <rect x="111" y="250" width="108" height="24" rx="6" class="box" />
  <text x="165" y="266" text-anchor="middle" class="box-text">BendersSeq</text>
  <rect x="111" y="280" width="108" height="24" rx="6" class="box" />
  <text x="165" y="296" text-anchor="middle" class="box-text">BendersBnB</text>

  <!-- Plug-and-play marker (BendersLibrary inserts into BendersBase) -->
  <path d="M177,300 L171,316 L159,316 L153,300" class="iface-line" />
  <path d="M175,302 L169,314 L161,314 L155,302" class="iface-line" />
  <path d="M153,336 L159,316 L171,316 L177,336" class="iface-line" />
  <path d="M155,334 L161,318 L169,318 L175,334" class="iface-line" />
  <path d="M165,346 L165,320" stroke="#475569" stroke-width="1.1" stroke-dasharray="4 3" fill="none"
    marker-end="url(#arrow)" />

  <path d="M97,336 L153,336 L159,316 L171,316 L177,336 L233,336 L233,424 L97,424 Z" class="ext" />
  <text x="165" y="360" text-anchor="middle" class="box-title">BendersLibrary</text>
  <rect x="111" y="372" width="108" height="24" rx="6" class="box" />
  <text x="165" y="388" text-anchor="middle" class="box-text">BendersSeqInOut</text>

  <!-- BendersBase foundation block -->
  <path d="M268,520 L782,520 L782,596 L756,606 L756,634 L782,644 L782,720 L268,720 Z" class="base" />
  <path d="M268,520 L782,520 L782,596 L756,606 L756,634 L782,644 L782,720 L268,720 Z" class="outer" />
  <path d="M782,596 L756,606 L756,634 L782,644" class="iface-line" />
  <path d="M778,600 L760,608 L760,632 L778,640" class="iface-line" />
  <text x="285" y="540" class="cluster-title">BendersBase (Foundation)</text>

  <rect x="298" y="560" width="250" height="146" rx="10" class="box" />
  <text x="423" y="584" text-anchor="middle" class="box-title">TypicalOracle</text>
  <rect x="320" y="606" width="206" height="22" rx="6" class="box" />
  <text x="423" y="621" text-anchor="middle" class="box-text">ClassicalOracle</text>
  <rect x="320" y="634" width="206" height="22" rx="6" class="box" />
  <text x="423" y="649" text-anchor="middle" class="box-text">ParetoOracle</text>
  <rect x="320" y="662" width="206" height="22" rx="6" class="box" />
  <text x="423" y="677" text-anchor="middle" class="box-text">UnifiedOracle</text>

  <rect x="593" y="560" width="180" height="146" rx="10" class="box" />
  <text x="683" y="584" text-anchor="middle" class="box-title">SeparableOracle</text>
  <rect x="628" y="626" width="110" height="36" rx="8" class="box" />
  <text x="683" y="648" text-anchor="middle" class="box-text">TypicalOracle</text>

  <!-- BendersLibrary extension block -->
  <path d="M840,520 L1200,520 L1200,720 L840,720 L840,644 L822,634 L812,620 L822,606 L840,596 Z" class="ext" />
  <path d="M840,520 L1200,520 L1200,720 L840,720 L840,644 L822,634 L812,620 L822,606 L840,596 Z" class="outer" />
  <path d="M840,596 L822,606 L812,620 L822,634 L840,644" class="iface-line" />
  <path d="M840,600 L824,608 L816,620 L824,632 L840,640" class="iface-line" />
  <path d="M826,620 L790,620" stroke="#475569" stroke-width="1.1" stroke-dasharray="4 3" fill="none"
    marker-end="url(#arrow)" />
  <text x="865" y="540" class="cluster-title">BendersLibrary</text>

  <rect x="888" y="560" width="136" height="146" rx="8" class="box" />
  <text x="956" y="588" text-anchor="middle" class="box-title">Problem-specific</text>
  <text x="956" y="606" text-anchor="middle" class="box-title">Oracle</text>
  <rect x="891" y="618" width="130" height="22" rx="6" class="box" />
  <text x="956" y="633" text-anchor="middle" class="label" style="font-size:10px;">CFLPknapsckoracle</text>
  <rect x="891" y="646" width="130" height="22" rx="6" class="box" />
  <text x="956" y="661" text-anchor="middle" class="label" style="font-size:10px;">UFLPknapsackoracle</text>

  <rect x="1059" y="560" width="136" height="146" rx="8" class="box" />
  <text x="1127" y="588" text-anchor="middle" class="box-title">DisjunctiveOracle</text>
  <rect x="1089" y="624" width="76" height="38" rx="7" class="box" />
  <text x="1127" y="646" text-anchor="middle" class="box-text">SplitOracle</text>

  <!-- Zoom connectors from Loop Strategy to left variants -->
  <path d="M431,274 L233,214" class="zoom-line" />
  <path d="M431,354 L233,424" class="zoom-line" />

  <!-- Zoom connectors from Oracle to implementation blocks -->
  <path d="M622,443 L268,520" class="zoom-line" />
  <path d="M818,443 L1200,520" class="zoom-line" />

  <!-- Plug-and-play principle band -->
  <rect x="170" y="780" width="1060" height="56" rx="10" class="band" />

  <!-- Plug-and-slot legend -->
  <g transform="translate(205,786)">
    <path d="M0,8 L78,8 L78,18 L66,22 L66,26 L78,30 L78,40 L0,40 Z" fill="#EAF2FF" stroke="#334155" stroke-width="1.0" />
    <path d="M78,18 L66,22 L66,26 L78,30" class="iface-line" />
    <path d="M75,19 L68,22.5 L68,25.5 L75,29" class="iface-line" />
    <path d="M94,11 L142,11 L142,37 L94,37 L94,31 L86,27 L82,24 L86,21 L94,17 Z" fill="#E9F7EF" stroke="#334155" stroke-width="1.0" />
    <path d="M94,17 L86,21 L82,24 L86,27 L94,31" class="iface-line" />
    <path d="M90,24 L74,24" stroke="#475569" stroke-width="1.1" stroke-dasharray="4 3" fill="none"
      marker-end="url(#arrow)" />
  </g>

  <text x="720" y="814" text-anchor="middle" class="box-text">Plug-and-play extension: BendersBase stays stable while
    BendersLibrary attaches interchangeable modules.</text>
</svg>
