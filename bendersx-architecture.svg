<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .title { font-family: "Times New Roman", Times, serif; font-size: 30px; font-weight: 700; fill: #111; }
      .subtitle { font-family: "Helvetica", Arial, sans-serif; font-size: 14px; fill: #222; }
      .cluster-title { font-family: "Times New Roman", Times, serif; font-size: 18px; font-weight: 700; fill: #111; }
      .box-title { font-family: "Helvetica", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #111; }
      .box-text { font-family: "Helvetica", Arial, sans-serif; font-size: 12px; fill: #111; }
      .label { font-family: "Helvetica", Arial, sans-serif; font-size: 11px; fill: #111; }
      .outer { fill: none; stroke: #2b2b2b; stroke-width: 1.5; }
      .loop { fill: #fff; stroke: #2b2b2b; stroke-width: 1.3; stroke-dasharray: 9 6; }
      .base { fill: #dfeeff; stroke: #2b2b2b; stroke-width: 1.2; }
      .ext { fill: #eaf7ea; stroke: #2b2b2b; stroke-width: 1.2; }
      .box { fill: #fff; stroke: #2b2b2b; stroke-width: 1.2; }
      .band { fill: #fff8dc; stroke: #2b2b2b; stroke-width: 1.2; }
      .arrow { stroke: #222; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .arrow-dashed { stroke: #222; stroke-width: 1.5; fill: none; stroke-dasharray: 7 4; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#222" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="#fff" />

  <text x="700" y="44" text-anchor="middle" class="title">BendersX Architecture</text>
  <text x="700" y="68" text-anchor="middle" class="subtitle">BendersBase provides the core workflow; BendersLibrary plugs in extensions</text>

  <!-- Outer environment -->
  <rect x="60" y="86" width="1280" height="690" rx="24" class="outer" />
  <text x="90" y="120" class="cluster-title">Environment</text>

  <!-- Core loop (as in sketch) -->
  <rect x="320" y="150" width="760" height="320" rx="36" class="loop" />

  <rect x="690" y="186" width="220" height="76" rx="10" class="box" />
  <text x="800" y="218" text-anchor="middle" class="box-title">Master</text>
  <text x="800" y="240" text-anchor="middle" class="box-text">core model</text>

  <rect x="450" y="282" width="150" height="84" rx="10" class="box" />
  <text x="525" y="312" text-anchor="middle" class="box-title">Loop Strategy</text>
  <text x="525" y="334" text-anchor="middle" class="box-text">control and schedule</text>

  <rect x="690" y="380" width="220" height="76" rx="10" class="box" />
  <text x="800" y="412" text-anchor="middle" class="box-title">Oracle</text>
  <text x="800" y="434" text-anchor="middle" class="box-text">separation and cuts</text>

  <rect x="1195" y="270" width="120" height="100" rx="10" class="box" />
  <text x="1255" y="297" text-anchor="middle" class="box-title">Log</text>
  <text x="1255" y="320" text-anchor="middle" class="box-text">observer</text>

  <!-- Core arrows -->
  <path d="M780,262 L780,380" class="arrow" />
  <text x="710" y="326" class="label">candidate solution</text>

  <path d="M820,380 L820,262" class="arrow" />
  <text x="836" y="326" class="label">cut</text>

  <path d="M600,324 C660,316 720,316 780,320" class="arrow-dashed" />

  <!-- Environment variants (outside loop, left side) -->
  <rect x="72" y="248" width="130" height="128" rx="10" class="base" />
  <text x="137" y="274" text-anchor="middle" class="box-title">BendersBase</text>
  <rect x="84" y="288" width="106" height="30" rx="6" class="box" />
  <text x="137" y="308" text-anchor="middle" class="box-text">BendersSeq</text>
  <rect x="84" y="324" width="106" height="30" rx="6" class="box" />
  <text x="137" y="344" text-anchor="middle" class="box-text">BendersBnB</text>

  <!-- Plug-and-play marker (BendersLibrary inserts into BendersBase) -->
  <rect x="133" y="362" width="8" height="14" rx="2" fill="#fff" stroke="#2b2b2b" stroke-width="1.0" />
  <rect x="134" y="380" width="6" height="12" rx="2" fill="#eaf7ea" stroke="#2b2b2b" stroke-width="1.0" />
  <path d="M137,386 L137,369" stroke="#222" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arrow)" />

  <rect x="72" y="392" width="130" height="96" rx="10" class="ext" />
  <text x="137" y="418" text-anchor="middle" class="box-title">BendersLibrary</text>
  <rect x="84" y="432" width="106" height="30" rx="6" class="box" />
  <text x="137" y="452" text-anchor="middle" class="box-text">BendersSeqInOut</text>

  <!-- BendersBase foundation block -->
  <rect x="430" y="500" width="520" height="220" rx="12" class="base" />
  <rect x="430" y="500" width="520" height="220" rx="12" class="outer" fill="none" />
  <rect x="942" y="603" width="8" height="14" rx="2" fill="#fff" stroke="#2b2b2b" stroke-width="1.0" />
  <text x="455" y="532" class="cluster-title">BendersBase (Foundation)</text>

  <rect x="460" y="550" width="255" height="145" rx="10" class="box" />
  <text x="588" y="576" text-anchor="middle" class="box-title">TypicalOracle</text>
  <rect x="482" y="590" width="210" height="24" rx="6" class="box" />
  <text x="587" y="607" text-anchor="middle" class="box-text">ClassicalOracle</text>
  <rect x="482" y="620" width="210" height="24" rx="6" class="box" />
  <text x="587" y="637" text-anchor="middle" class="box-text">ParetoOracle</text>
  <rect x="482" y="650" width="210" height="24" rx="6" class="box" />
  <text x="587" y="667" text-anchor="middle" class="box-text">UnifiedOracle</text>

  <rect x="735" y="550" width="185" height="145" rx="10" class="box" />
  <text x="828" y="576" text-anchor="middle" class="box-title">SeparableOracle</text>
  <rect x="765" y="618" width="125" height="44" rx="8" class="box" />
  <text x="828" y="644" text-anchor="middle" class="box-text">TypicalOracle</text>

  <!-- BendersLibrary extension block -->
  <rect x="1000" y="500" width="280" height="220" rx="12" class="ext" />
  <rect x="1000" y="500" width="280" height="220" rx="12" class="outer" fill="none" />
  <rect x="994" y="604" width="6" height="12" rx="2" fill="#eaf7ea" stroke="#2b2b2b" stroke-width="1.0" />
  <path d="M990,610 L950,610" stroke="#222" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arrow)" />
  <text x="1025" y="532" class="cluster-title">BendersLibrary</text>

  <rect x="1020" y="552" width="110" height="140" rx="8" class="box" />
  <text x="1075" y="582" text-anchor="middle" class="box-title">Problem-specific</text>
  <text x="1075" y="600" text-anchor="middle" class="box-title">Oracle</text>
  <rect x="1026" y="616" width="98" height="24" rx="6" class="box" />
  <text x="1075" y="632" text-anchor="middle" class="label" style="font-size:10px;">CFLPknapsckoracle</text>
  <rect x="1026" y="646" width="98" height="24" rx="6" class="box" />
  <text x="1075" y="662" text-anchor="middle" class="label" style="font-size:10px;">UFLPknapsackoracle</text>

  <rect x="1150" y="552" width="110" height="140" rx="8" class="box" />
  <text x="1205" y="584" text-anchor="middle" class="box-title">DisjunctiveOracle</text>
  <rect x="1166" y="614" width="78" height="46" rx="7" class="box" />
  <text x="1205" y="642" text-anchor="middle" class="box-text">SplitOracle</text>

  <!-- Connectors from extension blocks to loop -->
  <path d="M202,326 L450,326" class="arrow-dashed" />
  <path d="M800,456 L800,500" class="arrow" />

  <!-- Plug-and-play principle band -->
  <rect x="170" y="790" width="1060" height="56" rx="10" class="band" />

  <!-- Plug-and-slot legend -->
  <g transform="translate(205,799)">
    <rect x="0" y="8" width="78" height="32" rx="6" fill="#dfeeff" stroke="#2b2b2b" stroke-width="1.1" />
    <rect x="66" y="17" width="8" height="14" rx="2" fill="#fff" stroke="#2b2b2b" stroke-width="1.0" />
    <rect x="94" y="11" width="48" height="26" rx="5" fill="#eaf7ea" stroke="#2b2b2b" stroke-width="1.1" />
    <rect x="88" y="18" width="6" height="12" rx="2" fill="#eaf7ea" stroke="#2b2b2b" stroke-width="1.0" />
    <path d="M90,24 L74,24" stroke="#222" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arrow)" />
  </g>

  <text x="720" y="824" text-anchor="middle" class="box-text">Plug-and-play extension: BendersBase stays stable while BendersLibrary attaches interchangeable modules.</text>
</svg>
